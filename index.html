<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docket</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #F3F3EE;
    --paper: #FBFAF6;
    --ink: #1E2421;
    --muted: #6B6F66;
    --faint: #9A9D93;
    --accent: #2F6F62;
    --accent-ink: #ffffff;
    --accent-soft: #DCEAE6;
    --line: #D8D5CB;
    --overdue: #B4483A;
    --overdue-soft: rgba(180,72,58,0.35);
    --overdue-bg: rgba(180,72,58,0.08);
    --done: #9B9A8E;
    --paper-line: rgba(107,111,102,0.09);
    --card-bg: rgba(255,255,255,0.55);
    --card-border: rgba(30,36,33,0.09);
    --shadow: 0 1px 2px rgba(30,36,33,0.05), 0 6px 18px rgba(30,36,33,0.06);
    --high: #B4483A;
    --med: #B08A3E;
    --low: #52697A;
    --radius: 8px;
    --radius-sm: 4px;
  }

  :root[data-theme="dark"]{
    --bg: #1B1F1C;
    --paper: #20251F;
    --ink: #EDEBE2;
    --muted: #A2A79A;
    --faint: #767E70;
    --accent: #6FBFA6;
    --accent-ink: #10201A;
    --accent-soft: rgba(111,191,166,0.16);
    --line: #363C34;
    --overdue: #E28A79;
    --overdue-soft: rgba(226,138,121,0.35);
    --overdue-bg: rgba(226,138,121,0.10);
    --done: #6C7266;
    --paper-line: rgba(237,235,226,0.045);
    --card-bg: rgba(255,255,255,0.035);
    --card-border: rgba(237,235,226,0.10);
    --shadow: 0 1px 2px rgba(0,0,0,0.25), 0 6px 18px rgba(0,0,0,0.3);
    --high: #E28A79;
    --med: #D8B36B;
    --low: #86A6B8;
  }

  *{ box-sizing: border-box; }
  *:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  html{ scroll-behavior: smooth; }

  html, body{
    margin: 0; padding: 0; min-height: 100%;
    background-color: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  body{
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--paper-line) 31px, var(--paper-line) 32px);
  }

  h1,h2,h3,.serif{ font-family: 'Fraunces', serif; }
  .mono{ font-family: 'IBM Plex Mono', monospace; }
  button,input,textarea,select{ font-family: inherit; font-size: inherit; color: inherit; }
  button{ touch-action: manipulation; }
  a{ color: var(--accent); }
  p{ margin: 0 0 .6em 0; }
  .hidden{ display: none !important; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:6px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  @keyframes fadeSlideUp{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:none; } }
  @keyframes popIn{ from{ opacity:0; transform: scale(.97) translateY(4px);} to{ opacity:1; transform:none; } }
  @keyframes checkPulse{ 0%{ transform:scale(1);} 40%{ transform:scale(1.25);} 100%{ transform:scale(1);} }
  @keyframes toastIn{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform:none; } }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* ---------- LOGIN ---------- */
  #view-login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-box{ width:100%; max-width:380px; text-align:center; animation: fadeSlideUp .4s ease; }
  .wordmark{ font-size:44px; font-weight:600; letter-spacing:-0.01em; margin:0 0 6px 0; }
  .tagline{ font-style:italic; color:var(--muted); margin:0 0 30px 0; font-size:15px; }
  .field-label{ display:block; text-align:left; font-size:13px; color:var(--muted); margin-bottom:6px; }
  #view-login input[type="text"], #view-login input[type="email"], #view-login input[type="password"]{ width:100%; padding:10px 4px; border:none; border-bottom:1.5px solid var(--ink); background:transparent; outline:none; margin-bottom:18px; text-align:left; }
  #view-login input:focus{ border-bottom-color: var(--accent); }
  .btn-primary{ display:inline-flex; align-items:center; justify-content:center; gap:6px; width:100%; background:var(--ink); color:var(--bg); border:none; padding:12px 20px; border-radius:var(--radius-sm); cursor:pointer; letter-spacing:.01em; transition: background .15s ease, transform .1s ease; }
  .btn-primary:hover{ background:var(--accent); }
  .btn-primary:active{ transform: scale(.98); }
  .btn-primary:disabled{ opacity:.6; cursor:default; }
  :root[data-theme="dark"] .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  :root[data-theme="dark"] .btn-primary:hover{ background:#5CAB93; }
  .login-note{ margin-top:16px; font-size:12.5px; color:var(--muted); min-height:16px; }
  .login-note.error{ color:var(--overdue); }
  .login-demo{ margin-top:10px; }
  .btn-link{ background:none; border:none; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:13px; padding:4px; }
  .btn-link:hover{ color:var(--accent); }
  .auth-tabs{ display:flex; gap:4px; background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:3px; margin-bottom:26px; }
  .auth-tab{ flex:1; border:none; background:none; padding:8px 0; border-radius:6px; cursor:pointer; color:var(--muted); font-size:13.5px; font-family:inherit; transition:background .15s ease, color .15s ease; }
  .auth-tab.active{ background:var(--ink); color:var(--bg); }
  :root[data-theme="dark"] .auth-tab.active{ background:var(--accent); color:var(--accent-ink); }
  .auth-panel{ display:none; }
  .auth-panel.active{ display:block; animation: fadeSlideUp .3s ease; }

  /* ---------- APP SHELL ---------- */
  #app-shell{ display:flex; min-height:100vh; }

  .sidebar{
    flex: 0 0 220px; width:220px; background: var(--paper); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding: 22px 14px; position: sticky; top:0; height:100vh; overflow-y:auto;
    transition: transform .2s ease;
  }
  .sidebar-top{ display:flex; align-items:center; justify-content:space-between; padding: 0 8px 22px 8px; }
  .wordmark-sm{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; }
  .nav-list{ display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none; cursor:pointer;
    padding:9px 10px; border-radius:var(--radius-sm); color:var(--muted); font-size:14px; border-left:2px solid transparent;
    transition: background .12s ease, color .12s ease;
  }
  .nav-item .nav-ic{ width:18px; text-align:center; font-size:14px; }
  .nav-item:hover{ background: var(--accent-soft); color:var(--ink); }
  .nav-item.active{ color:var(--ink); border-left-color:var(--accent); background:var(--accent-soft); font-weight:500; }
  .nav-item .nav-badge{ margin-left:auto; font-size:11px; background:var(--overdue); color:#fff; border-radius:10px; padding:1px 6px; }
  .sidebar-bottom{ padding-top:14px; border-top:1px solid var(--line); margin-top:10px; }
  .sidebar-bottom .btn-primary{ padding:10px; font-size:13.5px; }

  .main-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line);
    background: var(--bg); position: sticky; top:0; z-index:20;
  }
  .search-trigger{
    flex:1; max-width:420px; text-align:left; background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:var(--radius-sm); padding:8px 12px; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .search-trigger:hover{ border-color:var(--accent); }
  .kbd{ font-family:'IBM Plex Mono',monospace; font-size:11px; background:var(--line); padding:1px 6px; border-radius:3px; color:var(--muted); }
  .topbar-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
  .who-name{ font-size:13px; font-weight:600; }
  .mobile-only{ display:none; }
  .btn-icon{ background:none; border:none; cursor:pointer; font-size:18px; padding:6px; line-height:1; border-radius:var(--radius-sm); color: var(--ink); }
  .btn-icon:hover{ background: var(--accent-soft); }

  .view-scroll{ flex:1; overflow-y:auto; }
  .view{ max-width:920px; margin:0 auto; padding: 30px 28px 90px 28px; animation: fadeSlideUp .25s ease; }
  .view-header{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .view-title{ font-size:26px; font-weight:600; margin:0 0 4px 0; }
  .view-sub{ color:var(--muted); font-size:13.5px; margin:0; }
  .view-actions{ display:flex; gap:10px; flex-wrap:wrap; }

  .btn-secondary{ background:transparent; color:var(--ink); border:1px solid var(--ink); padding:8px 16px; border-radius:var(--radius-sm); cursor:pointer; white-space:nowrap; transition: background .12s ease, color .12s ease; }
  .btn-secondary:hover{ background:var(--ink); color:var(--bg); }
  .btn-danger{ background:transparent; color:var(--overdue); border:1px solid var(--overdue); padding:8px 16px; border-radius:var(--radius-sm); cursor:pointer; }
  .btn-danger:hover{ background:var(--overdue); color:#fff; }
  .btn-sm{ padding:5px 11px; font-size:12.5px; }
  .btn-ghost{ background:none; border:none; color:var(--muted); cursor:pointer; padding:6px 8px; border-radius:var(--radius-sm); font-size:13px; }
  .btn-ghost:hover{ color:var(--accent); background:var(--accent-soft); }

  /* dashboard grid */
  .grid-2{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; }
  .grid-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px; }
  .stat-card{ background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); }
  .stat-num{ font-family:'Fraunces',serif; font-size:26px; font-weight:600; line-height:1; }
  .stat-label{ color:var(--muted); font-size:12px; margin-top:4px; }

  .card{ background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); margin-bottom:18px; }
  .card-title{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:0 0 12px 0; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .card-title small{ font-family:'IBM Plex Sans',sans-serif; font-weight:400; color:var(--muted); font-size:12px; }

  .greeting{ font-size:22px; margin:0 0 2px 0; }
  .greeting-date{ color:var(--muted); font-size:13.5px; margin:0 0 24px 0; }

  .next-item{ display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .next-item:last-child{ border-bottom:none; }
  .next-rank{ font-family:'Fraunces',serif; font-style:italic; color:var(--faint); font-size:15px; width:16px; flex:none; padding-top:1px; }
  .next-body{ flex:1; min-width:0; }
  .next-title{ font-weight:500; }
  .next-reason{ color:var(--muted); font-size:12.5px; margin-top:2px; }

  .schedule-row{ display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .schedule-row:last-child{ border-bottom:none; }
  .schedule-time{ color:var(--muted); width:64px; flex:none; font-size:12.5px; }
  .class-dot{ width:8px; height:8px; border-radius:50%; flex:none; }

  /* badges */
  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:2px 8px; border-radius:20px; border:1px solid var(--card-border); color:var(--muted); white-space:nowrap; }
  .badge-priority-high{ color:var(--high); border-color: var(--high); }
  .badge-priority-medium{ color:var(--med); border-color: var(--med); }
  .badge-priority-low{ color:var(--low); border-color: var(--low); }
  .badge-status{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }
  .badge-overdue{ background:var(--overdue-bg); color:var(--overdue); border-color:transparent; }
  .badge-type{ font-family:'IBM Plex Mono',monospace; }
  .priority-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; flex:none; }
  .priority-dot.high{ background:var(--high); }
  .priority-dot.medium{ background:var(--med); }
  .priority-dot.low{ background:var(--low); }

  /* assignment rows */
  .add-row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:22px; align-items:center; }
  .add-row input[type="text"], .add-row input[type="date"]{
    background:transparent; border:none; border-bottom:1px solid var(--line); padding:8px 2px; outline:none;
  }
  .add-row input:focus{ border-bottom-color: var(--accent); }
  #quickTitleInput{ flex:1 1 220px; min-width:160px; }
  #quickDueInput{ flex:0 0 150px; color:var(--muted); }
  .btn-add{ background:var(--accent); color:var(--accent-ink); border:none; padding:8px 18px; border-radius:var(--radius-sm); cursor:pointer; white-space:nowrap; }
  .btn-add:hover{ filter:brightness(1.08); }

  .toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
  .toolbar select, .toolbar input[type="text"]{
    background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-sm); padding:7px 10px; outline:none;
  }
  .toolbar select:focus, .toolbar input:focus{ border-color:var(--accent); }

  .tabs{ display:flex; gap:22px; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto; }
  .tab{ background:none; border:none; padding:0 0 10px 0; font-size:14px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
  .tab.active{ color:var(--ink); border-bottom-color:var(--accent); }

  .group{ margin-bottom:26px; }
  .group-title{ font-style:italic; font-size:15.5px; color:var(--ink); margin:0 0 8px 0; display:flex; align-items:center; gap:8px; }
  .group-title.overdue{ color:var(--overdue); }
  .group-count{ color:var(--faint); font-style:normal; font-size:12px; }

  .task-row{ display:flex; align-items:flex-start; gap:12px; padding:10px 10px; margin:0 -10px; border-radius:var(--radius-sm); transition: background .1s ease; cursor:pointer; }
  .task-row:hover{ background: var(--card-bg); }
  .task-row.overdue-row{ background: var(--overdue-bg); }
  .task-row.overdue-row:hover{ filter:brightness(0.98); }

  .checkbox{ flex:0 0 auto; width:18px; height:18px; margin-top:2px; border:1.5px solid var(--ink); border-radius:4px; cursor:pointer; position:relative; background:transparent; }
  .checkbox.checked{ background:var(--accent); border-color:var(--accent); animation: checkPulse .25s ease; }
  .checkbox.checked::after{ content:''; position:absolute; left:5px; top:2px; width:5px; height:9px; border-right:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(40deg); }
  .checkbox:disabled{ opacity:.4; cursor:default; }

  .task-body{ flex:1; min-width:0; }
  .task-top{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .task-title{ font-size:15px; }
  .task-title.done{ color:var(--done); text-decoration:line-through; }
  .task-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin-top:4px; font-size:12.5px; color:var(--muted); }
  .task-subject{ display:inline-flex; align-items:center; gap:6px; }
  .subject-dot{ width:7px; height:7px; border-radius:50%; display:inline-block; }
  .task-due{ color:var(--muted); }
  .task-due.overdue{ color:var(--overdue); font-weight:500; }
  .task-due.today{ color:var(--accent); font-weight:500; }
  .progress-mini{ width:60px; height:4px; background:var(--line); border-radius:3px; overflow:hidden; flex:none; }
  .progress-mini > div{ height:100%; background:var(--accent); }
  .task-actions{ display:flex; gap:2px; flex:none; align-items:flex-start; }
  .task-delete{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:16px; padding:4px 6px; border-radius:var(--radius-sm); }
  .task-delete:hover{ color:var(--overdue); background:var(--overdue-bg); }

  .empty-state{ font-style:italic; color:var(--muted); padding:28px 4px; text-align:center; }
  .empty-state .btn-secondary{ margin-top:12px; font-style:normal; }

  /* Forms / modal */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; }
  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number],
  .field input[type=password], .field textarea, .field select{
    width:100%; background:var(--bg); border:1px solid var(--card-border); border-radius:var(--radius-sm);
    padding:9px 10px; outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--accent); }
  .field textarea{ resize:vertical; min-height:70px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field-row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .segmented{ display:flex; border:1px solid var(--card-border); border-radius:var(--radius-sm); overflow:hidden; }
  .segmented button{ flex:1; background:var(--bg); border:none; padding:8px 6px; cursor:pointer; font-size:13px; color:var(--muted); border-right:1px solid var(--card-border); }
  .segmented button:last-child{ border-right:none; }
  .segmented button.active{ background:var(--accent); color:var(--accent-ink); }

  .subtask-list{ display:flex; flex-direction:column; gap:6px; margin:8px 0; }
  .subtask-row{ display:flex; align-items:center; gap:8px; }
  .subtask-row input[type=text]{ flex:1; background:transparent; border:none; border-bottom:1px solid var(--line); padding:5px 2px; outline:none; }
  .subtask-row input[type=text].done{ color:var(--done); text-decoration:line-through; }
  .subtask-add{ display:flex; gap:8px; margin-top:6px; }
  .subtask-add input{ flex:1; background:transparent; border:none; border-bottom:1px dashed var(--line); padding:5px 2px; outline:none; }

  .tag-input-row{ display:flex; flex-wrap:wrap; gap:6px; padding:6px; border:1px solid var(--card-border); border-radius:var(--radius-sm); background:var(--bg); }
  .tag-pill{ background:var(--accent-soft); color:var(--accent); font-size:12px; padding:2px 8px; border-radius:12px; display:inline-flex; align-items:center; gap:5px; }
  .tag-pill button{ background:none; border:none; color:inherit; cursor:pointer; font-size:12px; padding:0; }
  .tag-input-row input{ border:none; background:none; outline:none; flex:1; min-width:60px; padding:3px; }

  /* Modal shell */
  .modal-overlay{ position:fixed; inset:0; background:rgba(20,24,20,0.4); backdrop-filter: blur(1.5px); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; animation: fadeSlideUp .15s ease; }
  .modal{ background:var(--paper); border-radius:var(--radius); width:100%; max-width:560px; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.25); animation: popIn .18s ease; border:1px solid var(--card-border); }
  .modal.modal-lg{ max-width:760px; }
  .modal.modal-sm{ max-width:400px; }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line); flex:none; }
  .modal-header h3{ margin:0; font-size:18px; }
  .modal-body{ padding:20px; overflow-y:auto; flex:1; }
  .modal-footer{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:16px 20px; border-top:1px solid var(--line); flex:none; flex-wrap:wrap; }
  .modal-footer-right{ display:flex; gap:10px; margin-left:auto; }

  /* Toast */
  .toast-container{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; max-width:420px; padding:0 16px; }
  .toast{ background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:var(--radius-sm); font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,0.2); animation: toastIn .18s ease; display:flex; align-items:center; gap:10px; width:100%; justify-content:space-between; }
  .toast.toast-error{ background:var(--overdue); color:#fff; }
  .toast.toast-success{ background:var(--accent); color:var(--accent-ink); }
  .toast button{ background:none; border:none; color:inherit; opacity:.7; cursor:pointer; font-size:13px; }

  /* Calendar */
  .cal-nav{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .cal-title{ font-family:'Fraunces',serif; font-size:18px; min-width:170px; text-align:center; }
  .cal-view-toggle{ margin-left:auto; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
  .cal-dow{ background:var(--paper); text-align:center; font-size:11px; color:var(--muted); padding:6px 0; }
  .cal-cell{ background:var(--paper); min-height:92px; padding:6px; font-size:12px; cursor:pointer; position:relative; transition: background .1s ease; }
  .cal-cell:hover{ background: var(--accent-soft); }
  .cal-cell.other-month{ background: var(--bg); color:var(--faint); }
  .cal-cell.today{ outline:2px solid var(--accent); outline-offset:-2px; }
  .cal-daynum{ font-weight:600; margin-bottom:4px; }
  .cal-event{ font-size:10.5px; padding:1px 5px; border-radius:3px; margin-bottom:2px; background:var(--accent-soft); color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .cal-event.overdue-ev{ background:var(--overdue-bg); color:var(--overdue); }
  .cal-event.exam-ev{ background:var(--high); color:#fff; }
  .cal-more{ font-size:10px; color:var(--muted); }
  .cal-week-row .cal-cell{ min-height:160px; }
  .cal-day-list{ display:flex; flex-direction:column; gap:8px; }

  /* Planner */
  .planner-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  .planner-day{ background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:10px; min-height:220px; display:flex; flex-direction:column; gap:6px; }
  .planner-day.today-col{ outline:2px solid var(--accent); outline-offset:-2px; }
  .planner-day-head{ font-weight:600; font-size:13px; display:flex; justify-content:space-between; align-items:center; margin-bottom:2px; }
  .planner-day-date{ color:var(--muted); font-weight:400; font-size:11.5px; }
  .planner-item{ background:var(--paper); border:1px solid var(--card-border); border-left:3px solid var(--accent); border-radius:4px; padding:5px 7px; font-size:11.5px; cursor:pointer; }
  .planner-item.exam-item{ border-left-color:var(--high); }
  .planner-item.study-item{ border-left-color:var(--low); }
  .planner-item-time{ color:var(--muted); font-size:10.5px; }
  .planner-add{ margin-top:auto; background:none; border:1px dashed var(--card-border); border-radius:4px; color:var(--muted); font-size:11.5px; padding:5px; cursor:pointer; }
  .planner-add:hover{ border-color:var(--accent); color:var(--accent); }

  /* classes */
  .class-card{ background:var(--card-bg); border:1px solid var(--card-border); border-left:4px solid var(--accent); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; cursor:pointer; box-shadow:var(--shadow); }
  .class-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .class-name{ font-family:'Fraunces',serif; font-size:17px; font-weight:600; }
  .class-meta{ color:var(--muted); font-size:12.5px; margin-top:2px; }
  .class-stats{ display:flex; gap:16px; margin-top:10px; font-size:12.5px; color:var(--muted); }

  .color-swatches{ display:flex; gap:8px; flex-wrap:wrap; }
  .color-swatch{ width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .color-swatch.selected{ border-color:var(--ink); }

  .schedule-editor-row{ display:grid; grid-template-columns: 90px 1fr 1fr auto; gap:8px; align-items:center; margin-bottom:8px; }

  /* exams */
  .exam-card{ background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; box-shadow:var(--shadow); cursor:pointer; }
  .exam-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .exam-countdown{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--accent); }
  .exam-countdown.soon{ color:var(--overdue); }

  /* notes */
  .note-card{ background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; cursor:pointer; box-shadow:var(--shadow); }
  .note-title{ font-weight:600; margin-bottom:4px; }
  .note-preview{ color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .note-meta{ font-size:11.5px; color:var(--faint); margin-top:6px; }

  /* stats */
  .bar-chart-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; font-size:12.5px; }
  .bar-chart-label{ width:110px; flex:none; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-chart-track{ flex:1; height:10px; background:var(--line); border-radius:5px; overflow:hidden; }
  .bar-chart-fill{ height:100%; background:var(--accent); border-radius:5px; transition: width .4s ease; }
  .bar-chart-val{ width:34px; text-align:right; color:var(--muted); flex:none; }

  .streak-row{ display:flex; align-items:center; gap:14px; }
  .streak-num{ font-family:'Fraunces',serif; font-size:34px; font-weight:600; color:var(--accent); }

  /* timer */
  .timer-display{ text-align:center; padding:20px 0; }
  .timer-clock{ font-family:'IBM Plex Mono',monospace; font-size:52px; font-weight:500; }
  .timer-controls{ display:flex; gap:10px; justify-content:center; margin-top:16px; }

  /* settings */
  .settings-section{ margin-bottom:26px; }
  .settings-section h3{ font-size:15px; margin:0 0 12px 0; }
  .settings-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:1px solid var(--line); }
  .settings-row:last-child{ border-bottom:none; }
  .settings-row-label{ font-size:13.5px; }
  .settings-row-hint{ color:var(--muted); font-size:12px; margin-top:2px; }
  .switch{ position:relative; width:40px; height:22px; background:var(--line); border-radius:20px; cursor:pointer; border:none; flex:none; }
  .switch.on{ background:var(--accent); }
  .switch::after{ content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition: left .15s ease; }
  .switch.on::after{ left:20px; }

  /* search modal */
  .search-input-lg{ width:100%; padding:12px 14px; font-size:16px; border:none; border-bottom:1px solid var(--line); background:transparent; outline:none; }
  .search-input-lg:focus{ border-bottom-color:var(--accent); }
  .search-result{ display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); cursor:pointer; }
  .search-result:hover{ background:var(--accent-soft); }
  .search-result-type{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; width:70px; flex:none; }

  .canvas-panel{ padding:16px 18px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card-bg); margin-top:10px; }
  .canvas-panel-hint{ font-size:12.5px; color:var(--muted); margin:0 0 14px 0; line-height:1.5; }
  .canvas-row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .canvas-row input{ background:var(--bg); border:1px solid var(--card-border); border-radius:var(--radius-sm); padding:8px 10px; outline:none; }
  #canvasDomainInput{ flex:1 1 200px; }
  #canvasTokenInput{ flex:1 1 220px; }
  .canvas-status{ font-size:12.5px; color:var(--muted); margin-top:8px; line-height:1.5; }

  .activity-row{ display:flex; gap:10px; align-items:baseline; font-size:12.5px; padding:6px 0; border-bottom:1px solid var(--line); color:var(--muted); }
  .activity-row:last-child{ border-bottom:none; }
  .activity-time{ color:var(--faint); flex:none; width:54px; }

  .wizard-steps{ display:flex; gap:6px; margin-bottom:18px; }
  .wizard-dot{ flex:1; height:4px; background:var(--line); border-radius:2px; }
  .wizard-dot.done, .wizard-dot.active{ background:var(--accent); }

  .loading-msg{ text-align:center; color:var(--muted); font-style:italic; padding-top:60px; }

  /* mobile */
  @media (max-width: 880px){
    .grid-2{ grid-template-columns:1fr; }
    .grid-stats{ grid-template-columns:repeat(2,1fr); }
    .planner-grid{ grid-template-columns:repeat(1,1fr); }
  }
  @media (max-width: 760px){
    .mobile-only{ display:inline-flex; }
    .sidebar{ position:fixed; left:0; top:0; z-index:90; transform: translateX(-100%); box-shadow:0 0 30px rgba(0,0,0,0.25); }
    .sidebar.open{ transform:translateX(0); }
    .view{ padding: 20px 16px 90px 16px; }
    .topbar{ padding:12px 14px; }
    .search-trigger .kbd{ display:none; }
    .grid-stats{ grid-template-columns:repeat(2,1fr); }
    .field-row, .field-row3{ grid-template-columns:1fr; }
    .modal{ max-width:100%; width:100%; max-height:100%; height:100%; border-radius:0; }
    .modal-overlay{ padding:0; align-items:stretch; }
    .cal-cell{ min-height:60px; font-size:10.5px; }
    .cal-daynum{ font-size:11px; }
  }
</style>

<!-- Supabase client (auth + database). Docket's backend is Supabase, not Cloudflare —
     see supabase-config.js for the two values you need to fill in after creating
     your Supabase project. -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
  'use strict';
  /* =========================================================
     DOCKET v2 — data layer, utilities, and app logic
     ========================================================= */

  const STORAGE_PREFIX = 'docket';
  const SCHEMA_VERSION = 2;
  const ASSIGN_TYPES = ['homework','quiz','test','project','essay','lab','reading','other'];
  const CLASS_COLORS = ['#2F6F62','#B08A3E','#7A5C7E','#52697A','#A15C43','#3D6EA8','#8A6D3B','#5C7A5A'];

  let currentUser = null;      // display name (string) — used throughout the UI/templates
  let currentAccount = null;   // { id, name, email } for the signed-in account, or null in demo mode
  let isDemoMode = false;
  let state = null;
  let ui = { view:'dashboard', assignFilter:{status:'all', subject:'', priority:'', type:'', tag:'', sort:'due'}, calDate: new Date(), calView:'month', plannerWeekOffset:0, editingAssignmentId:null, editingClassId:null, editingExamId:null, editingNoteId:null, timer:null, sidebarOpen:false };

  /* ---------- storage ----------
     Signed-in accounts persist to the backend (D1 via Cloudflare Pages Functions),
     with a localStorage mirror per-user for instant loads/offline resilience.
     Demo mode never talks to the backend — it's local-only, like before. */
  const Store = {
    get(key){ try{ const raw = localStorage.getItem(key); return raw === null ? null : { value: raw }; }catch(e){ return null; } },
    set(key, value){ try{ localStorage.setItem(key, value); return true; }catch(e){ return false; } },
    remove(key){ try{ localStorage.removeItem(key); }catch(e){} }
  };

  function dataKey(user){ return STORAGE_PREFIX + ':data:v2:' + user.toLowerCase(); }
  function legacyTaskKey(user){ return STORAGE_PREFIX + ':tasks:' + user.toLowerCase(); }
  function legacyCanvasKey(user){ return STORAGE_PREFIX + ':canvas:' + user.toLowerCase(); }
  function lastUserKey(){ return STORAGE_PREFIX + ':lastUser'; }
  function cacheKey(accountId){ return STORAGE_PREFIX + ':cache:v2:' + accountId; }

  /* ---------- backend API ----------
     Backed by Supabase (Postgres + Supabase Auth) rather than Cloudflare
     Pages Functions/D1. This object keeps the exact same external shape
     (ok/user/error, getState/saveState) the rest of the app already expects,
     so nothing outside this block needed to change. */
  const supabaseClient = (window.supabase && window.DOCKET_SUPABASE_URL && window.DOCKET_SUPABASE_URL.indexOf('REPLACE_WITH') !== 0)
    ? window.supabase.createClient(window.DOCKET_SUPABASE_URL, window.DOCKET_SUPABASE_ANON_KEY)
    : null;

  function toAccount(user){
    if(!user) return null;
    return { id: user.id, name: (user.user_metadata && user.user_metadata.name) || user.email, email: user.email };
  }
  function friendlyAuthError(msg){
    if(!msg) return 'Something went wrong.';
    if(/already registered|already exists/i.test(msg)) return 'An account with that email already exists.';
    if(/invalid login credentials/i.test(msg)) return 'Incorrect email or password.';
    if(/email not confirmed/i.test(msg)) return 'Check your inbox to confirm your email before logging in.';
    if(/password should be at least/i.test(msg)) return 'Password must be at least 8 characters.';
    return msg;
  }

  const Api = {
    _needsConfig(){
      return !supabaseClient;
    },
    async signup(name, email, password){
      if(this._needsConfig()) return { ok:false, error:'Docket isn\u2019t connected to Supabase yet — see supabase-config.js.' };
      const { data, error } = await supabaseClient.auth.signUp({
        email, password, options: { data: { name } }
      });
      if(error) return { ok:false, error: friendlyAuthError(error.message) };
      if(!data.session){
        // Email confirmation is turned on for this project — there's no
        // session yet, so tell the person to confirm before we can log them in.
        return { ok:false, error:'Account created — check your email to confirm it, then log in.' };
      }
      return { ok:true, user: toAccount(data.user) };
    },
    async login(email, password){
      if(this._needsConfig()) return { ok:false, error:'Docket isn\u2019t connected to Supabase yet — see supabase-config.js.' };
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error) return { ok:false, error: friendlyAuthError(error.message) };
      return { ok:true, user: toAccount(data.user) };
    },
    async logout(){
      if(this._needsConfig()) return;
      try{ await supabaseClient.auth.signOut(); }catch(e){}
    },
    async me(){
      if(this._needsConfig()) return null;
      try{
        const { data } = await supabaseClient.auth.getSession();
        const user = data && data.session && data.session.user;
        return toAccount(user);
      }catch(e){ return null; }
    },
    async getState(){
      if(this._needsConfig()) throw new Error('not_configured');
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const user = sessionData && sessionData.session && sessionData.session.user;
      if(!user) throw new Error('state_fetch_failed');
      const { data, error } = await supabaseClient
        .from('docket_state').select('data').eq('user_id', user.id).maybeSingle();
      if(error) throw new Error('state_fetch_failed');
      return (data && data.data) || null;
    },
    async saveState(stateObj){
      if(this._needsConfig()) return false;
      try{
        const { data: sessionData } = await supabaseClient.auth.getSession();
        const user = sessionData && sessionData.session && sessionData.session.user;
        if(!user) return false;
        await supabaseClient.from('docket_state').upsert({
          user_id: user.id, data: stateObj, updated_at: new Date().toISOString()
        });
        return true;
      }catch(e){ return false; }
    },
    async changePassword(currentPassword, newPassword){
      if(this._needsConfig()) return { ok:false, error:'Docket isn\u2019t connected to Supabase yet — see supabase-config.js.' };
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const email = sessionData && sessionData.session && sessionData.session.user && sessionData.session.user.email;
      if(!email) return { ok:false, error:'You need to be logged in.' };
      // Supabase's updateUser() doesn't ask for the current password itself,
      // so re-authenticate with it first to confirm it's really the account owner.
      const check = await supabaseClient.auth.signInWithPassword({ email, password: currentPassword });
      if(check.error) return { ok:false, error:'Current password is incorrect.' };
      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
      if(error) return { ok:false, error: friendlyAuthError(error.message) };
      return { ok:true };
    }
  };

  /* ---------- utils ---------- */
  function uid(){ return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
  function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
  function byId(id){ return document.getElementById(id); }
  function qs(sel, root){ return (root||document).querySelector(sel); }
  function qsa(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }

  function pad2(n){ return String(n).padStart(2,'0'); }
  function fmtISO(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function todayDate(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function todayISO(){ return fmtISO(todayDate()); }
  function parseISO(iso){
    if(!iso || typeof iso !== 'string') return null;
    const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m) return null;
    const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
    if(isNaN(d.getTime())) return null;
    return d;
  }
  function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function daysBetweenISO(isoA, isoB){
    const a = parseISO(isoA), b = parseISO(isoB);
    if(!a || !b) return null;
    return Math.round((b - a) / 86400000);
  }
  function weekdayName(iso){ const d = parseISO(iso); return d ? d.toLocaleDateString(undefined,{weekday:'long'}) : ''; }
  function shortDate(iso){ const d = parseISO(iso); return d ? d.toLocaleDateString(undefined,{month:'short', day:'numeric'}) : ''; }
  function monthYear(d){ return d.toLocaleDateString(undefined,{month:'long', year:'numeric'}); }
  function fmtTime12(t){
    if(!t) return '';
    const [h,m] = t.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    const h12 = ((h % 12) || 12);
    return h12 + ':' + pad2(m) + ' ' + period;
  }
  function nowHM(){ const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }

  function dueLabel(iso){
    if(!iso) return '';
    const diff = daysBetweenISO(todayISO(), iso);
    if(diff === null) return '';
    if(diff < 0) return Math.abs(diff) + (Math.abs(diff)===1 ? ' day overdue' : ' days overdue');
    if(diff === 0) return 'Due today';
    if(diff === 1) return 'Due tomorrow';
    if(diff <= 6) return 'Due ' + weekdayName(iso);
    return 'Due ' + shortDate(iso);
  }
  function dueLabelShort(iso){
    if(!iso) return '';
    const diff = daysBetweenISO(todayISO(), iso);
    if(diff === null) return '';
    if(diff < 0) return Math.abs(diff) + 'd overdue';
    if(diff === 0) return 'today';
    if(diff === 1) return 'tomorrow';
    if(diff <= 6) return weekdayName(iso);
    return shortDate(iso);
  }
  function examCountdown(iso){
    const diff = daysBetweenISO(todayISO(), iso);
    if(diff === null) return '';
    if(diff < 0) return 'Passed';
    if(diff === 0) return 'Today';
    if(diff === 1) return 'Tomorrow';
    return diff + ' days';
  }

  /* ---------- default state / migration ---------- */
  function defaultState(user){
    return {
      version: SCHEMA_VERSION,
      user,
      assignments: [],
      classes: [],
      exams: [],
      notes: [],
      studySessions: [],
      activity: [],
      planMyDay: null,
      settings: {
        theme: 'system',
        accent: 'green',
        defaultDuration: 30,
        weekStart: 1,
        defaultCalendarView: 'month',
        notifications: false,
        canvas: { domain:'', token:'', lastSynced:null, connected:false }
      },
      ui: { onboarded: false, demo:false }
    };
  }

  function migrateLegacy(user){
    const s = defaultState(user);
    const legacy = Store.get(legacyTaskKey(user));
    if(legacy){
      try{
        const oldTasks = JSON.parse(legacy.value);
        if(Array.isArray(oldTasks)){
          oldTasks.forEach(t => {
            s.assignments.push({
              id: t.id || uid(),
              title: t.title || 'Untitled',
              subject: t.subject || '',
              classId: null,
              due: t.due || '',
              dueTime: '',
              priority: 'medium',
              estimate: null,
              description: '',
              type: 'homework',
              status: t.done ? 'completed' : 'not-started',
              progress: t.done ? 100 : 0,
              grade: '',
              tags: [],
              subtasks: [],
              created: t.createdAt || Date.now(),
              modified: Date.now(),
              source: t.fromCanvas ? 'canvas' : 'manual',
              canvasId: t.fromCanvas ? t.id : null,
              archived: false
            });
          });
        }
      }catch(e){ /* ignore malformed legacy data */ }
    }
    const legacyCanvas = Store.get(legacyCanvasKey(user));
    if(legacyCanvas){
      try{
        const creds = JSON.parse(legacyCanvas.value);
        s.settings.canvas.domain = creds.domain || '';
        s.settings.canvas.token = creds.token || '';
        s.settings.canvas.connected = !!(creds.domain && creds.token);
      }catch(e){}
    }
    s.ui.onboarded = true; // returning user — skip the setup wizard
    return s;
  }

  function migrateState(s){
    if(!s.version || s.version < 2){
      s.version = 2;
      s.studySessions = s.studySessions || [];
      s.exams = s.exams || [];
      s.notes = s.notes || [];
      s.classes = s.classes || [];
      s.activity = s.activity || [];
      s.planMyDay = s.planMyDay || null;
      s.settings = s.settings || defaultState(s.user).settings;
      s.ui = s.ui || { onboarded:true, demo:false };
    }
    // defensive fills for anything missing/corrupt
    s.assignments = Array.isArray(s.assignments) ? s.assignments.filter(a => a && typeof a === 'object') : [];
    s.assignments.forEach(a => {
      if(!a.id) a.id = uid();
      if(!a.status) a.status = a.done ? 'completed' : 'not-started';
      if(typeof a.progress !== 'number') a.progress = a.status==='completed' ? 100 : 0;
      if(!a.priority) a.priority = 'medium';
      if(!a.type || ASSIGN_TYPES.indexOf(a.type) === -1) a.type = 'homework';
      if(!Array.isArray(a.subtasks)) a.subtasks = [];
      if(!Array.isArray(a.tags)) a.tags = [];
      if(!a.source) a.source = 'manual';
      if(typeof a.archived !== 'boolean') a.archived = false;
      if(!a.created) a.created = Date.now();
    });
    if(!s.settings.canvas) s.settings.canvas = { domain:'', token:'', lastSynced:null, connected:false };
    if(!s.settings.weekStart && s.settings.weekStart !== 0) s.settings.weekStart = 1;
    if(!s.settings.defaultDuration) s.settings.defaultDuration = 30;
    return s;
  }

  function loadLocalState(user){
    const r = Store.get(dataKey(user));
    if(r){
      try{
        let parsed = JSON.parse(r.value);
        return migrateState(parsed);
      }catch(e){
        return migrateLegacy(user);
      }
    }
    return migrateLegacy(user);
  }

  // Loads state for a signed-in account: tries the backend first (source of
  // truth), falls back to the local cache if offline, migrates either way.
  async function loadAccountState(account){
    const cache = Store.get(cacheKey(account.id));
    try{
      const remote = await Api.getState();
      if(remote){
        const migrated = migrateState(remote);
        Store.set(cacheKey(account.id), JSON.stringify(migrated));
        return migrated;
      }
    }catch(e){
      if(cache){
        try{ return migrateState(JSON.parse(cache.value)); }catch(e2){}
      }
      toast("Couldn't reach the server — showing your last saved data.", 'error');
    }
    // Brand-new account with nothing saved yet
    return defaultState(account.name);
  }

  let saveDebounceTimer = null;
  function saveState(){
    if(!currentUser) return;
    if(isDemoMode){
      Store.set(dataKey(currentUser), JSON.stringify(state));
      return;
    }
    if(!currentAccount) return;
    // Write-through local cache immediately for snappy reloads...
    Store.set(cacheKey(currentAccount.id), JSON.stringify(state));
    // ...and debounce the network save so rapid edits don't spam the API.
    clearTimeout(saveDebounceTimer);
    saveDebounceTimer = setTimeout(() => { Api.saveState(state); }, 500);
  }

  function logActivity(type, text){

  /* ---------- classes lookup ---------- */
  function getClass(id){ return state.classes.find(c => c.id === id) || null; }
  function classForAssignment(a){
    if(a.classId) return getClass(a.classId);
    if(a.subject){ return state.classes.find(c => c.name.toLowerCase() === a.subject.toLowerCase()) || null; }
    return null;
  }
  function subjectLabel(a){
    const c = classForAssignment(a);
    if(c) return c.name;
    return a.subject || '';
  }
  function subjectColorFor(a){
    const c = classForAssignment(a);
    if(c && c.color) return c.color;
    return subjectColorHash(a.subject || subjectLabel(a));
  }
  function subjectColorHash(subject){
    if(!subject) return '#B7B4A8';
    let hash = 0;
    for(let i=0;i<subject.length;i++){ hash = subject.charCodeAt(i) + ((hash << 5) - hash); }
    return CLASS_COLORS[Math.abs(hash) % CLASS_COLORS.length];
  }
  function linkAssignmentToClass(a){
    if(a.subject){
      const match = state.classes.find(c => c.name.toLowerCase() === a.subject.trim().toLowerCase());
      a.classId = match ? match.id : null;
    } else {
      a.classId = null;
    }
  }

  /* ---------- assignment helpers ---------- */
  function isDone(a){ return a.status === 'completed'; }
  function isOverdue(a){ return a.due && a.due < todayISO() && !isDone(a); }
  function activeAssignments(){ return state.assignments.filter(a => !a.archived); }

  const PRIORITY_WEIGHT = { high:3, medium:2, low:1 };

  function scoreAssignment(a){
    let score = 0; const reasons = [];
    if(isDone(a)) return { score:-999, reasons:['completed'] };
    if(!a.due){
      score += 2;
    } else {
      const diff = daysBetweenISO(todayISO(), a.due);
      if(diff < 0){ score += 100 + Math.min(20, -diff); reasons.push((-diff)+' day'+(-diff===1?'':'s')+' overdue'); }
      else if(diff === 0){ score += 60; reasons.push('due today'); }
      else if(diff === 1){ score += 45; reasons.push('due tomorrow'); }
      else if(diff <= 3){ score += 28; reasons.push('due in ' + diff + ' days'); }
      else if(diff <= 7){ score += 12; reasons.push('due ' + weekdayName(a.due)); }
    }
    score += (PRIORITY_WEIGHT[a.priority] || 2) * 8;
    reasons.push(a.priority + ' priority');
    if(a.estimate){ reasons.push('estimated ' + a.estimate + ' min'); }
    if(a.status === 'in-progress'){ score += 4; reasons.push('already in progress'); }
    return { score, reasons };
  }

  function whatsNext(limit){
    const list = activeAssignments().filter(a => !isDone(a)).map(a => ({ a, s: scoreAssignment(a) }));
    list.sort((x,y) => y.s.score - x.s.score || (x.a.due||'9999').localeCompare(y.a.due||'9999'));
    return list.slice(0, limit || 3);
  }

  function renderCurrentView(){

    const fn = VIEW_RENDERERS[ui.view];
    if(fn) fn();
    updateNavBadge();
  }
  function updateNavBadge(){
    const overdueCount = activeAssignments().filter(isOverdue).length;
    const btn = qs('.nav-item[data-view="today"]');
    let badge = btn.querySelector('.nav-badge');
    if(overdueCount > 0){
      if(!badge){ badge = document.createElement('span'); badge.className='nav-badge'; btn.appendChild(badge); }
      badge.textContent = overdueCount;
    } else if(badge){ badge.remove(); }
  }

  /* =========================================================
     ASSIGNMENT CRUD
     ========================================================= */
  function newAssignment(overrides){
    const a = {
      id: uid(), title:'', subject:'', classId:null, due:'', dueTime:'', priority:'medium',
      estimate:null, description:'', type:'homework', status:'not-started', progress:0, grade:'',
      tags:[], subtasks:[], created: Date.now(), modified: Date.now(), source:'manual', canvasId:null, archived:false
    };
    Object.assign(a, overrides||{});
    linkAssignmentToClass(a);
    return a;
  }

  function openAssignmentModal(id, prefill){
    ui.editingAssignmentId = id;
    const existing = id ? state.assignments.find(a => a.id===id) : null;
    const a = existing || newAssignment(prefill||{});
    const isNew = !existing;
    const classOptions = `<option value="">No class</option>` + state.classes.map(c => `<option value="${c.id}" ${a.classId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('');

    openModal({
      title: isNew ? 'New assignment' : 'Edit assignment',
      large: true,
      bodyHtml: `
        <div class="field"><label for="amTitle">Title</label><input type="text" id="amTitle" value="${escapeHtml(a.title)}" placeholder="e.g. Biology lab report"></div>
        <div class="field-row3">
          <div class="field"><label for="amClass">Class</label><select id="amClass">${classOptions}</select></div>
          <div class="field"><label for="amDue">Due date</label><input type="date" id="amDue" value="${a.due||''}"></div>
          <div class="field"><label for="amDueTime">Due time</label><input type="time" id="amDueTime" value="${a.dueTime||''}"></div>
        </div>
        <div class="field-row3">
          <div class="field"><label>Priority</label>
            <div class="segmented" id="amPriority">
              <button type="button" data-v="low" class="${a.priority==='low'?'active':''}">Low</button>
              <button type="button" data-v="medium" class="${a.priority==='medium'?'active':''}">Medium</button>
              <button type="button" data-v="high" class="${a.priority==='high'?'active':''}">High</button>
            </div>
          </div>
          <div class="field"><label for="amType">Type</label><select id="amType">${ASSIGN_TYPES.map(t=>`<option value="${t}" ${a.type===t?'selected':''}>${t[0].toUpperCase()+t.slice(1)}</option>`).join('')}</select></div>
          <div class="field"><label for="amEstimate">Estimated time (min)</label><input type="number" min="0" step="5" id="amEstimate" value="${a.estimate!=null?a.estimate:''}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Status</label>
            <div class="segmented" id="amStatus">
              <button type="button" data-v="not-started" class="${a.status==='not-started'?'active':''}">Not started</button>
              <button type="button" data-v="in-progress" class="${a.status==='in-progress'?'active':''}">In progress</button>
              <button type="button" data-v="completed" class="${a.status==='completed'?'active':''}">Completed</button>
            </div>
          </div>
          <div class="field"><label for="amProgress">Progress (<span id="amProgressVal">${a.progress}</span>%)</label><input type="range" min="0" max="100" step="5" id="amProgress" value="${a.progress}"></div>
        </div>
        <div class="field"><label for="amDesc">Description / notes</label><textarea id="amDesc" placeholder="Details, links, instructions&hellip;">${escapeHtml(a.description)}</textarea></div>
        <div class="field-row">
          <div class="field"><label for="amGrade">Grade / value (optional)</label><input type="text" id="amGrade" value="${escapeHtml(a.grade)}" placeholder="e.g. 92% or 20 pts"></div>
          <div class="field"><label>Tags</label>
            <div class="tag-input-row" id="amTagRow">
              ${a.tags.map(t=>`<span class="tag-pill">${escapeHtml(t)}<button type="button" data-tag="${escapeHtml(t)}">&times;</button></span>`).join('')}
              <input type="text" id="amTagInput" placeholder="Add tag, Enter">
            </div>
          </div>
        </div>
        <div class="field">
          <label>Subtasks ${a.subtasks.length ? `(<span id="amSubCount">${a.subtasks.filter(s=>s.done).length}/${a.subtasks.length}</span> complete)` : ''}</label>
          <div class="subtask-list" id="amSubtaskList">${renderSubtaskRows(a.subtasks)}</div>
          <div class="subtask-add"><input type="text" id="amSubtaskInput" placeholder="Add a step, Enter"><button class="btn-secondary btn-sm" id="amAddSubtask" type="button">Add</button></div>
        </div>
        ${a.source==='canvas' ? `<p class="settings-row-hint">Imported from Canvas${a.canvasId?'':''}. You can still edit it — Docket won't overwrite your changes to status or notes on the next sync.</p>` : ''}
      `,
      footerHtml: `
        <div>${isNew ? '' : `<button class="btn-danger btn-sm" id="amDelete">Delete</button>`}</div>
        <div class="modal-footer-right">
          <button class="btn-ghost" id="amCancel">Cancel</button>
          <button class="btn-primary" id="amSave" style="width:auto;">${isNew ? 'Add assignment' : 'Save changes'}</button>
        </div>`,
      onMount(){
        let localTags = a.tags.slice();
        let localSubtasks = a.subtasks.map(s => ({...s}));
        let localPriority = a.priority, localStatus = a.status;

        qsa('#amPriority button').forEach(b => b.addEventListener('click', () => {
          localPriority = b.dataset.v;
          qsa('#amPriority button').forEach(x=>x.classList.toggle('active', x===b));
        }));
        qsa('#amStatus button').forEach(b => b.addEventListener('click', () => {
          localStatus = b.dataset.v;
          qsa('#amStatus button').forEach(x=>x.classList.toggle('active', x===b));
          if(localStatus==='completed'){ byId('amProgress').value = 100; byId('amProgressVal').textContent = 100; }
          if(localStatus==='not-started'){ byId('amProgress').value = 0; byId('amProgressVal').textContent = 0; }
        }));
        byId('amProgress').addEventListener('input', (e) => { byId('amProgressVal').textContent = e.target.value; });

        function refreshTags(){
          const row = byId('amTagRow');
          qsa('.tag-pill', row).forEach(p => p.remove());
          const input = byId('amTagInput');
          localTags.forEach(t => {
            const pill = document.createElement('span');
            pill.className = 'tag-pill';
            pill.innerHTML = `${escapeHtml(t)}<button type="button">&times;</button>`;
            pill.querySelector('button').addEventListener('click', () => { localTags = localTags.filter(x=>x!==t); refreshTags(); });
            row.insertBefore(pill, input);
          });
        }
        byId('amTagInput').addEventListener('keydown', (e) => {
          if(e.key === 'Enter'){
            e.preventDefault();
            const v = e.target.value.trim();
            if(v && localTags.indexOf(v)===-1){ localTags.push(v); e.target.value=''; refreshTags(); }
          }
        });

        function refreshSubtasks(){
          byId('amSubtaskList').innerHTML = renderSubtaskRows(localSubtasks);
          qsa('.subtask-row', byId('amSubtaskList')).forEach(row => {
            const sid = row.dataset.id;
            row.querySelector('.checkbox').addEventListener('click', () => {
              const st = localSubtasks.find(s=>s.id===sid); st.done = !st.done; refreshSubtasks();
            });
            row.querySelector('input[type=text]').addEventListener('change', (e) => {
              const st = localSubtasks.find(s=>s.id===sid); st.text = e.target.value;
            });
            row.querySelector('.task-delete').addEventListener('click', () => {
              localSubtasks = localSubtasks.filter(s=>s.id!==sid); refreshSubtasks();
            });
          });
        }
        refreshSubtasks();
        function addSubtaskFromInput(){
          const inp = byId('amSubtaskInput');
          const v = inp.value.trim();
          if(!v) return;
          localSubtasks.push({ id: uid(), text: v, done:false });
          inp.value=''; refreshSubtasks();
        }
        byId('amAddSubtask').addEventListener('click', addSubtaskFromInput);
        byId('amSubtaskInput').addEventListener('keydown', (e) => { if(e.key==='Enter'){ e.preventDefault(); addSubtaskFromInput(); } });

        byId('amCancel').addEventListener('click', closeModal);
        if(!isNew){
          byId('amDelete').addEventListener('click', () => {
            confirmDialog('Delete "' + a.title + '" permanently? This can\'t be undone.', {
              confirmLabel:'Delete', onConfirm(){
                state.assignments = state.assignments.filter(x=>x.id!==a.id);
                saveState(); closeModal(); renderCurrentView(); toast('Assignment deleted');
              }
            });
          });
        }
        byId('amSave').addEventListener('click', () => {
          const title = byId('amTitle').value.trim();
          if(!title){ toast('Give the assignment a title', 'error'); byId('amTitle').focus(); return; }
          const classSel = byId('amClass').value;
          const cls = getClass(classSel);
          a.title = title;
          a.classId = cls ? cls.id : null;
          a.subject = cls ? cls.name : (a.subject||'');
          a.due = byId('amDue').value;
          a.dueTime = byId('amDueTime').value;
          a.priority = localPriority;
          a.type = byId('amType').value;
          a.estimate = byId('amEstimate').value ? Number(byId('amEstimate').value) : null;
          a.status = localStatus;
          a.progress = Number(byId('amProgress').value);
          if(a.status==='completed') a.progress = 100;
          a.description = byId('amDesc').value;
          a.grade = byId('amGrade').value.trim();
          a.tags = localTags;
          a.subtasks = localSubtasks;
          a.modified = Date.now();
          if(isNew){
            state.assignments.push(a);
            logActivity('add', 'Added "' + a.title + '"');
            toast('Assignment added', 'success');
          } else {
            logActivity('edit', 'Edited "' + a.title + '"');
            toast('Changes saved', 'success');
          }
          saveState();
          closeModal();
          renderCurrentView();
        });
      }
    });
  }

  function renderSubtaskRows(subtasks){
    if(!subtasks.length) return `<p style="color:var(--faint); font-size:12.5px; margin:0;">No steps yet.</p>`;
    return subtasks.map(s => `
      <div class="subtask-row" data-id="${s.id}">
        <button type="button" class="checkbox${s.done?' checked':''}" aria-label="Toggle step"></button>
        <input type="text" value="${escapeHtml(s.text)}" class="${s.done?'done':''}">
        <button type="button" class="task-delete" aria-label="Remove step">&times;</button>
      </div>`).join('');
  }

  function toggleAssignmentStatus(id){
    const a = state.assignments.find(x=>x.id===id); if(!a) return;
    if(a.status === 'completed'){ a.status = 'not-started'; a.progress = 0; }
    else { a.status = 'completed'; a.progress = 100; logActivity('complete', 'Completed "'+a.title+'"'); }
    a.modified = Date.now();
    saveState();
    renderCurrentView();
  }
  function toggleSubtask(assignmentId, subtaskId){
    const a = state.assignments.find(x=>x.id===assignmentId); if(!a) return;
    const st = a.subtasks.find(s=>s.id===subtaskId); if(!st) return;
    st.done = !st.done;
    const total = a.subtasks.length, done = a.subtasks.filter(s=>s.done).length;
    if(total){ a.progress = Math.round((done/total)*100); if(done===total && a.status!=='completed'){ /* leave status manual */ } }
    a.modified = Date.now();
    saveState();
    renderCurrentView();
  }
  function deleteAssignmentQuick(id){
    const a = state.assignments.find(x=>x.id===id); if(!a) return;
    confirmDialog('Delete "' + a.title + '"?', { confirmLabel:'Delete', onConfirm(){
      state.assignments = state.assignments.filter(x=>x.id!==id);
      saveState(); renderCurrentView(); toast('Assignment deleted');
    }});
  }
  function archiveAssignment(id){
    const a = state.assignments.find(x=>x.id===id); if(!a) return;
    a.archived = true; saveState(); renderCurrentView(); toast('Archived');
  }
  function restoreAssignment(id){
    const a = state.assignments.find(x=>x.id===id); if(!a) return;
    a.archived = false; saveState(); renderCurrentView(); toast('Restored');
  }

  window.__docket = {
    toggleAssign: toggleAssignmentStatus,
    deleteAssign: deleteAssignmentQuick,
    openAssign: (id) => openAssignmentModal(id),
    toggleSubtask, archiveAssignment, restoreAssignment,
    openClass: (id) => openClassDetail(id),
    openExam: (id) => openExamModal(id),
    openNote: (id) => openNoteModal(id),
    calGoto: (iso) => { ui.calDate = parseISO(iso) || new Date(); setView('calendar'); },
    calNewAt: (iso) => openAssignmentModal(null, { due: iso })
  };

  function greetingWord(){
    const h = new Date().getHours();
    if(h < 5) return 'Up late';
    if(h < 12) return 'Good morning';
    if(h < 17) return 'Good afternoon';
    return 'Good evening';
  }

  function renderMiniList(items, label, overdueStyle){
    if(!items.length) return '';
    return `<p class="group-title ${overdueStyle?'overdue':''}" style="margin-top:10px;">${label} <span class="group-count">${items.length}</span></p>` +
      items.slice(0,5).map(a => `
        <div class="task-row" onclick="__docket.openAssign('${a.id}')">
          <button class="checkbox${isDone(a)?' checked':''}" onclick="event.stopPropagation(); __docket.toggleAssign('${a.id}')" aria-label="Mark complete"></button>
          <div class="task-body">
            <div class="task-top">
              <span class="priority-dot ${a.priority}"></span>
              <span class="task-title">${escapeHtml(a.title)}</span>
            </div>
            <div class="task-meta">
              ${subjectLabel(a) ? `<span class="task-subject"><span class="subject-dot" style="background:${subjectColorFor(a)}"></span>${escapeHtml(subjectLabel(a))}</span>` : ''}
              ${a.due ? `<span class="task-due ${isOverdue(a)?'overdue':(a.due===todayISO()?'today':'')}">${dueLabel(a.due)}</span>` : ''}
            </div>
          </div>
        </div>`).join('');
  }

  function todaysSchedule(){
    const dow = new Date().getDay(); // 0=Sun..6=Sat
    const rows = [];
    state.classes.forEach(c => (c.schedule||[]).forEach(s => { if(s.day === dow) rows.push({ name:c.name, start:s.start, end:s.end, color:c.color }); }));
    rows.sort((a,b)=> a.start.localeCompare(b.start));
    return rows;
  }
  function nextClassToday(){
    const now = nowHM();
    const upcoming = todaysSchedule().filter(s => s.start >= now);
    return upcoming[0] || null;
  }

  function computeStreak(){
    // count consecutive days (including today) with at least one assignment completed or study session finished
    let streak = 0;
    for(let i=0;i<365;i++){
      const iso = fmtISO(addDays(todayDate(), -i));
      const hasCompletion = state.assignments.some(a => isDone(a) && a.modified && fmtISO(new Date(a.modified)) === iso)
        || state.studySessions.some(s => s.completed && s.date === iso);
      if(hasCompletion) streak++;
      else if(i===0) continue; // today might just not have one yet, don't break streak on day 0
      else break;
    }
    return streak;
  }

  /* =========================================================
     PLAN MY DAY
     ========================================================= */
  function renderPlanMyDay(container, silent){
    const iso = todayISO();
    let plan = state.planMyDay && state.planMyDay.date === iso ? state.planMyDay : generatePlan(iso);
    state.planMyDay = plan;
    saveState();
    drawPlan(container, plan);
    if(!silent) toast('Plan generated');
  }

  function generatePlan(iso){
    const candidates = whatsNext(8).filter(x => !x.a.due || daysBetweenISO(iso, x.a.due) <= 7);
    const busy = [];
    todaysSchedule().forEach(s => busy.push({ start:s.start, end:s.end }));
    state.studySessions.filter(s=>s.date===iso).forEach(s => busy.push({ start:s.startTime, end: addMinutesToTime(s.startTime, s.durationMin) }));

    function overlaps(start, end){
      return busy.some(b => start < b.end && end > b.start);
    }
    function toMin(hm){ const [h,m]=hm.split(':').map(Number); return h*60+m; }
    function toHM(min){ return pad2(Math.floor((min%1440)/60)) + ':' + pad2(min%60); }

    const dayStartMin = Math.max(toMin(nowHM()) + 10, toMin('15:30')); // after "now" and not before mid-afternoon by default
    let cursor = dayStartMin;
    const dayEnd = toMin('21:00');
    const blocks = [];
    for(const { a, s } of candidates){
      if(blocks.length >= 5) break;
      const dur = a.estimate || state.settings.defaultDuration || 30;
      let start = cursor;
      let attempts = 0;
      while(overlaps(toHM(start), toHM(start+dur)) && attempts < 20){ start += 15; attempts++; }
      const end = start + dur;
      if(end > dayEnd) continue;
      blocks.push({ id: uid(), assignmentId: a.id, title: a.title, subject: subjectLabel(a), start: toHM(start), end: toHM(end), reasons: s.reasons });
      busy.push({ start: toHM(start), end: toHM(end) });
      cursor = end + 10;
    }
    return { date: iso, blocks };
  }

  function drawPlan(container, plan){
    if(!plan.blocks.length){
      container.innerHTML = `<p class="empty-state">Nothing urgent to schedule — enjoy the free time, or check Assignments for anything further out.</p>`;
      return;
    }
    container.innerHTML = `<div id="planBlocks">` + plan.blocks.map((b,i) => `
      <div class="next-item" data-idx="${i}">
        <span class="next-rank mono">${fmtTime12(b.start)}</span>
        <div class="next-body">
          <div class="next-title">${escapeHtml(b.subject ? b.subject + ' — ' : '')}${escapeHtml(b.title)} <span class="settings-row-hint">(${fmtTime12(b.start)}&ndash;${fmtTime12(b.end)})</span></div>
          <div class="next-reason">${b.reasons.join(', ')}</div>
        </div>
        <button class="task-delete" aria-label="Remove from plan" data-remove="${i}">&times;</button>
      </div>`).join('') + `</div>`;
    qsa('[data-remove]', container).forEach(btn => btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.remove);
      plan.blocks.splice(idx,1);
      state.planMyDay = plan; saveState();
      drawPlan(container, plan);
    }));
  }

  VIEW_RENDERERS.today = function(){
    const el = byId('view-today');
    const iso = todayISO();
    const list = activeAssignments();
    const overdue = list.filter(isOverdue);
    const dueToday = list.filter(a => a.due===iso && !isDone(a));

  function quickAddFromToolbar(){
    const titleRaw = byId('quickTitleInput').value.trim();
    const dueField = byId('quickDueInput').value;
    if(!titleRaw) return;
    const parsed = parseQuickAdd(titleRaw);
    const a = newAssignment({ title: parsed.title, due: dueField || parsed.due || '' });
    state.assignments.push(a);
    logActivity('add', 'Added "'+a.title+'"');
    saveState();
    byId('quickTitleInput').value=''; byId('quickDueInput').value='';
    renderAssignmentGroups();
    toast('Assignment added', 'success');
  }

  function parseQuickAdd(text){
    const weekdays = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
    const lower = text.toLowerCase();
    let due = '';
    let title = text;
    const wd = weekdays.find(w => lower.endsWith(' ' + w) || lower.endsWith(' ' + w.slice(0,3)));
    if(lower.endsWith(' today')){ due = todayISO(); title = text.slice(0, -6).trim(); }
    else if(lower.endsWith(' tomorrow')){ due = fmtISO(addDays(todayDate(),1)); title = text.slice(0,-9).trim(); }
    else if(wd){
      const targetIdx = weekdays.indexOf(wd);
      const todayIdx = todayDate().getDay();
      let delta = (targetIdx - todayIdx + 7) % 7;
      if(delta === 0) delta = 7;
      due = fmtISO(addDays(todayDate(), delta));
      const re = new RegExp('\\s+' + wd + '$', 'i');
      title = text.replace(re, '').trim();
      const re2 = new RegExp('\\s+' + wd.slice(0,3) + '$', 'i');
      title = title.replace(re2, '').trim();
    }
    return { title: title || text, due };
  }

  function renderAssignmentGroups(){
    const container = byId('assignmentGroups');
    if(!container) return;
    const f = ui.assignFilter;
    let list = activeAssignments();
    if(f.status === 'active') list = list.filter(a=>!isDone(a));
    else if(f.status !== 'all') list = list.filter(a=>a.status===f.status);
    if(f.subject) list = list.filter(a=>subjectLabel(a)===f.subject);
    if(f.priority) list = list.filter(a=>a.priority===f.priority);
    if(f.type) list = list.filter(a=>a.type===f.type);
    if(f.tag) list = list.filter(a=>a.tags.includes(f.tag));

    const sortFns = {
      due: (a,b) => (a.due||'9999').localeCompare(b.due||'9999'),
      priority: (a,b) => (PRIORITY_WEIGHT[b.priority]||0) - (PRIORITY_WEIGHT[a.priority]||0),
      created: (a,b) => b.created - a.created,
      estimate: (a,b) => (b.estimate||0) - (a.estimate||0),
      subject: (a,b) => subjectLabel(a).localeCompare(subjectLabel(b))
    };
    list = list.slice().sort(sortFns[f.sort] || sortFns.due);

    if(!list.length){
      container.innerHTML = `<p class="empty-state">${activeAssignments().length ? 'Nothing matches these filters.' : 'Nothing on your docket yet.'}<br><button class="btn-secondary" onclick="__docket.openAssign(null)">Add an assignment</button></p>`;
      return;
    }

    function bucketFor(a){
      if(isDone(a)) return 'Completed';
      if(!a.due) return 'No due date';
      const diff = daysBetweenISO(todayISO(), a.due);
      if(diff < 0) return 'Overdue';
      if(diff === 0) return 'Today';
      if(diff <= 7) return 'This week';
      return 'Later';
    }
    const order = ['Overdue','Today','This week','Later','No due date','Completed'];
    const groups = {};
    list.forEach(a => { const b = bucketFor(a); (groups[b]=groups[b]||[]).push(a); });

    let html = '';
    order.forEach(b => {
      if(!groups[b]) return;
      html += `<div class="group"><p class="group-title ${b==='Overdue'?'overdue':''}">${b} <span class="group-count">${groups[b].length}</span></p>${groups[b].map(renderTaskRow).join('')}</div>`;
    });
    container.innerHTML = html;
  }

  function openArchiveModal(){
    const archived = state.assignments.filter(a=>a.archived);
    openModal({
      title: 'Archived assignments', large:true,
      bodyHtml: archived.length ? archived.map(a => `
        <div class="task-row">
          <div class="task-body">
            <div class="task-title">${escapeHtml(a.title)}</div>

          <button class="btn-secondary btn-sm" onclick="__docket.restoreAssign('${a.id}'); __docket.openArchive && __docket.openArchive();">Restore</button>
        </div>`).join('') : `<p class="empty-state">Nothing archived.</p>`,
      footerHtml: `<div></div><div class="modal-footer-right"><button class="btn-ghost" onclick="document.getElementById('modalOverlay').classList.add('hidden')">Close</button></div>`
    });
  }

  VIEW_RENDERERS.calendar = function(){
    const el = byId('view-calendar');
    el.innerHTML = `
      <div class="view-header">
        <div><h1 class="view-title">Calendar</h1><p class="view-sub">Assignments and exams on their due dates.</p></div>
      </div>
      <div class="cal-nav">
