        <button class="btn-secondary btn-sm" id="calTodayBtn">Today</button>
        <button class="btn-secondary btn-sm" id="calNext">Next &rarr;</button>
        <div class="cal-title serif" id="calTitle"></div>
        <div class="cal-view-toggle segmented" id="calViewToggle" style="width:220px;">
          <button type="button" data-v="month">Month</button>
          <button type="button" data-v="week">Week</button>
          <button type="button" data-v="day">Day</button>
        </div>
      </div>
      <div id="calBody"></div>
    `;
    qsa('#calViewToggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.v === ui.calView);
      b.addEventListener('click', () => { ui.calView = b.dataset.v; renderCalendar(); });
    });
    byId('calPrev').addEventListener('click', () => { calStep(-1); });
    byId('calNext').addEventListener('click', () => { calStep(1); });
    byId('calTodayBtn').addEventListener('click', () => { ui.calDate = new Date(); renderCalendar(); });
    renderCalendar();
  };

  function calStep(dir){
    if(ui.calView === 'month'){ ui.calDate = new Date(ui.calDate.getFullYear(), ui.calDate.getMonth()+dir, 1); }
    else if(ui.calView === 'week'){ ui.calDate = addDays(ui.calDate, dir*7); }
    else { ui.calDate = addDays(ui.calDate, dir); }
    renderCalendar();
  }

  function eventsForDate(iso){
    const evs = [];
    activeAssignments().forEach(a => { if(a.due === iso) evs.push({ kind:'assignment', id:a.id, title:a.title, done:isDone(a), overdue:isOverdue(a) }); });
    state.exams.forEach(e => { if(e.date === iso) evs.push({ kind:'exam', id:e.id, title:e.name }); });
    return evs;
  }

  function renderCalendar(){
    const body = byId('calBody');
    if(!body) return;
    if(ui.calView === 'month') renderCalMonth(body);
    else if(ui.calView === 'week') renderCalWeek(body);
    else renderCalDay(body);
  }

  function renderCalMonth(body){
    const d = ui.calDate;
    byId('calTitle').textContent = monthYear(d);
    const first = new Date(d.getFullYear(), d.getMonth(), 1);
    const weekStart = state.settings.weekStart || 1;
    let startOffset = (first.getDay() - weekStart + 7) % 7;
    const gridStart = addDays(first, -startOffset);
    const dowLabels = [];
    for(let i=0;i<7;i++){ dowLabels.push(addDays(gridStart,i).toLocaleDateString(undefined,{weekday:'short'})); }

    let html = `<div class="cal-grid">` + dowLabels.map(l=>`<div class="cal-dow">${l}</div>`).join('');
    for(let i=0;i<42;i++){
      const day = addDays(gridStart, i);
      const iso = fmtISO(day);
      const inMonth = day.getMonth() === d.getMonth();
      const evs = eventsForDate(iso);
      const isToday = iso === todayISO();
      html += `<div class="cal-cell ${inMonth?'':'other-month'} ${isToday?'today':''}" data-date="${iso}">
        <div class="cal-daynum">${day.getDate()}</div>
        ${evs.slice(0,3).map(e => `<div class="cal-event ${e.kind==='exam'?'exam-ev':(e.overdue?'overdue-ev':'')}" data-ev="${e.kind}:${e.id}">${escapeHtml(e.title)}</div>`).join('')}
        ${evs.length>3 ? `<div class="cal-more">+${evs.length-3} more</div>` : ''}
      </div>`;
      if(i%7===6 && i<41) {} // continue grid
    }
    html += `</div>`;
    body.innerHTML = html;
    bindCalCells(body);
  }

  function renderCalWeek(body){
    const weekStart = state.settings.weekStart || 1;
    const d = ui.calDate;
    let offset = (d.getDay() - weekStart + 7) % 7;
    const start = addDays(d, -offset);
    byId('calTitle').textContent = start.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' – ' + addDays(start,6).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    let html = `<div class="cal-grid cal-week-row">` + Array.from({length:7}).map((_,i)=>`<div class="cal-dow">${addDays(start,i).toLocaleDateString(undefined,{weekday:'short'})}</div>`).join('');
    for(let i=0;i<7;i++){
      const day = addDays(start,i); const iso = fmtISO(day);
      const evs = eventsForDate(iso);
      const isToday = iso===todayISO();
      html += `<div class="cal-cell ${isToday?'today':''}" data-date="${iso}">
        <div class="cal-daynum">${day.getDate()}</div>
        ${evs.map(e => `<div class="cal-event ${e.kind==='exam'?'exam-ev':(e.overdue?'overdue-ev':'')}" data-ev="${e.kind}:${e.id}">${escapeHtml(e.title)}</div>`).join('')}
      </div>`;
    }
    html += `</div>`;
    body.innerHTML = html;
    bindCalCells(body);
  }

  function renderCalDay(body){
    const iso = fmtISO(ui.calDate);
    byId('calTitle').textContent = ui.calDate.toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
    const evs = eventsForDate(iso);
    const sched = state.classes.flatMap(c => (c.schedule||[]).filter(s=>s.day===ui.calDate.getDay()).map(s=>({name:c.name,start:s.start,color:c.color})));
    sched.sort((a,b)=>a.start.localeCompare(b.start));
    body.innerHTML = `
      <div class="card"><p class="card-title">Classes</p>${sched.length?sched.map(s=>`<div class="schedule-row"><span class="schedule-time">${fmtTime12(s.start)}</span><span class="class-dot" style="background:${s.color}"></span>${escapeHtml(s.name)}</div>`).join(''):'<p class="empty-state">No classes.</p>'}</div>
      <div class="card"><p class="card-title">Due / exams <button class="btn-ghost" data-newat="${iso}">+ add</button></p>
      <div class="cal-day-list">${evs.length ? evs.map(e=>`<div class="task-row" data-ev="${e.kind}:${e.id}"><span class="priority-dot ${e.kind==='exam'?'high':'medium'}"></span> ${escapeHtml(e.title)}</div>`).join('') : `<p class="empty-state">Nothing due this day.</p>`}</div></div>
    `;
    bindCalCells(body);
  }

  function bindCalCells(body){
    qsa('.cal-cell[data-date]', body).forEach(cell => {
      cell.addEventListener('click', (e) => {
        if(e.target.closest('[data-ev]')) return;
        __docket.calNewAt(cell.dataset.date);
      });
    });
    qsa('[data-ev]', body).forEach(evEl => {
      evEl.addEventListener('click', (e) => {
        e.stopPropagation();
        const [kind,id] = evEl.dataset.ev.split(':');
        if(kind==='assignment') openAssignmentModal(id); else openExamModal(id);
      });
    });
    const newAtBtn = qs('[data-newat]', body);
    if(newAtBtn) newAtBtn.addEventListener('click', () => __docket.calNewAt(newAtBtn.dataset.newat));
  }

  /* =========================================================
     WEEKLY PLANNER
     ========================================================= */
  VIEW_RENDERERS.planner = function(){
    const el = byId('view-planner');
    el.innerHTML = `
      <div class="view-header">
        <div><h1 class="view-title">Weekly Planner</h1><p class="view-sub">Assignments, exams and study blocks, Monday through Sunday.</p></div>
        <div class="view-actions">
          <button class="btn-secondary btn-sm" id="plPrev">&larr; Prev week</button>
          <button class="btn-secondary btn-sm" id="plToday">This week</button>
          <button class="btn-secondary btn-sm" id="plNext">Next week &rarr;</button>
        </div>
      </div>
      <div class="planner-grid" id="plannerGrid"></div>
    `;
    byId('plPrev').addEventListener('click', () => { ui.plannerWeekOffset--; renderPlanner(); });
    byId('plNext').addEventListener('click', () => { ui.plannerWeekOffset++; renderPlanner(); });
    byId('plToday').addEventListener('click', () => { ui.plannerWeekOffset = 0; renderPlanner(); });
    renderPlanner();
  };

  function renderPlanner(){
    const grid = byId('plannerGrid');
    if(!grid) return;
    const weekStart = state.settings.weekStart || 1;
    const base = addDays(todayDate(), ui.plannerWeekOffset*7);
    let offset = (base.getDay() - weekStart + 7) % 7;
    const start = addDays(base, -offset);
    let html = '';
    for(let i=0;i<7;i++){
      const day = addDays(start, i); const iso = fmtISO(day);
      const isToday = iso === todayISO();
      const evs = eventsForDate(iso);
      const sessions = state.studySessions.filter(s=>s.date===iso);
      html += `<div class="planner-day ${isToday?'today-col':''}">
        <div class="planner-day-head">${day.toLocaleDateString(undefined,{weekday:'short'})} <span class="planner-day-date">${day.getDate()}</span></div>
        ${evs.map(e => `<div class="planner-item ${e.kind==='exam'?'exam-item':''}" data-ev="${e.kind}:${e.id}">${escapeHtml(e.title)}</div>`).join('')}
        ${sessions.map(s => `<div class="planner-item study-item" data-study="${s.id}"><div class="planner-item-time">${fmtTime12(s.startTime)}</div>${escapeHtml(s.subject||'Study')} &middot; ${s.durationMin}min</div>`).join('')}
        <button class="planner-add" data-newat="${iso}">+ Add</button>
      </div>`;
    }
    grid.innerHTML = html;
    qsa('[data-ev]', grid).forEach(evEl => evEl.addEventListener('click', () => {
      const [kind,id] = evEl.dataset.ev.split(':');
      if(kind==='assignment') openAssignmentModal(id); else openExamModal(id);
    }));
    qsa('[data-study]', grid).forEach(evEl => evEl.addEventListener('click', () => openStudySessionModal(evEl.dataset.study)));
    qsa('[data-newat]', grid).forEach(btn => btn.addEventListener('click', () => openPlannerAddChoice(btn.dataset.newat)));
  }

  function openPlannerAddChoice(iso){
    openModal({
      title: 'Add to ' + shortDate(iso), small:true,
      bodyHtml: `<p class="view-sub">What would you like to add on this day?</p>`,
      footerHtml: `<div></div><div class="modal-footer-right" style="flex-direction:column; align-items:stretch; gap:8px;">
        <button class="btn-secondary" id="pcAssign">Assignment</button>
        <button class="btn-secondary" id="pcStudy">Study session</button>
      </div>`,
      onMount(){
        byId('pcAssign').addEventListener('click', () => { closeModal(); openAssignmentModal(null, { due: iso }); });
        byId('pcStudy').addEventListener('click', () => { closeModal(); openStudySessionModal(null, { date: iso }); });
      }
    });
  }

    const upcoming = state.exams.filter(e => daysBetweenISO(todayISO(), e.date) >= 0).sort((a,b)=>a.date.localeCompare(b.date));

    if(!state.exams.length){
      el.innerHTML = `<p class="empty-state">No exams tracked yet.<br><button class="btn-secondary" onclick="document.getElementById('examNewBtn').click()">Add an exam</button></p>`;
      return;
    }
    function card(e){
      const c = getClass(e.classId);
      const related = activeAssignments().filter(a=>a.classId===e.classId && !isDone(a)).length;
      const diff = daysBetweenISO(todayISO(), e.date);
      return `<div class="exam-card" data-id="${e.id}">
        <div class="exam-top">
          <div><div class="class-name" style="font-size:16px;">${escapeHtml(e.name)}</div><div class="class-meta">${c?escapeHtml(c.name)+' &middot; ':''}${shortDate(e.date)}${e.time?' &middot; '+fmtTime12(e.time):''}${e.location?' &middot; '+escapeHtml(e.location):''}</div></div>

  /* =========================================================
     STATS / INSIGHTS
     ========================================================= */
  VIEW_RENDERERS.stats = function(){
    const el = byId('view-stats');
    const all = activeAssignments();
    const done = all.filter(isDone).length;
    const remaining = all.length - done;
    const pct = all.length ? Math.round((done/all.length)*100) : 0;
    const weekAgo = fmtISO(addDays(todayDate(),-7));
    const monthAgo = fmtISO(addDays(todayDate(),-30));
    const doneThisWeek = all.filter(a=>isDone(a)&&a.modified&&fmtISO(new Date(a.modified))>=weekAgo).length;
    const doneThisMonth = all.filter(a=>isDone(a)&&a.modified&&fmtISO(new Date(a.modified))>=monthAgo).length;
    const totalStudyMin = state.studySessions.filter(s=>s.completed).reduce((sum,s)=>sum+(s.actualMin||s.durationMin||0),0);
    const weekStudyMin = state.studySessions.filter(s=>s.completed && s.date>=weekAgo).reduce((sum,s)=>sum+(s.actualMin||s.durationMin||0),0);

    const bySubject = {};
    all.filter(a=>!isDone(a)).forEach(a => { const s = subjectLabel(a) || 'No subject'; bySubject[s] = (bySubject[s]||0)+1; });
    const subjectEntries = Object.entries(bySubject).sort((a,b)=>b[1]-a[1]);
    const maxSubj = Math.max(1, ...subjectEntries.map(e=>e[1]));

    const next7 = {};
    for(let i=0;i<7;i++){ next7[fmtISO(addDays(todayDate(),i))] = 0; }
    all.filter(a=>!isDone(a) && a.due && next7.hasOwnProperty(a.due)).forEach(a => next7[a.due]++);
    const maxWorkload = Math.max(1, ...Object.values(next7));

    el.innerHTML = `
      <div class="view-header"><div><h1 class="view-title">Insights</h1><p class="view-sub">A snapshot of your workload and habits.</p></div></div>
      <div class="grid-stats">
        <div class="stat-card"><div class="stat-num">${done}</div><div class="stat-label">Completed</div></div>
        <div class="stat-card"><div class="stat-num">${remaining}</div><div class="stat-label">Remaining</div></div>
        <div class="stat-card"><div class="stat-num">${pct}%</div><div class="stat-label">Completion rate</div></div>
        <div class="stat-card"><div class="stat-num">${computeStreak()}</div><div class="stat-label">Day streak</div></div>
      </div>
      <div class="grid-2">
        <div>
          <div class="card"><p class="card-title">Workload by subject <small>active only</small></p>
            ${subjectEntries.length ? subjectEntries.map(([s,n]) => `<div class="bar-chart-row"><span class="bar-chart-label">${escapeHtml(s)}</span><span class="bar-chart-track"><span class="bar-chart-fill" style="width:${(n/maxSubj)*100}%"></span></span><span class="bar-chart-val">${n}</span></div>`).join('') : '<p class="empty-state">Nothing active right now.</p>'}
          </div>
          <div class="card"><p class="card-title">Upcoming workload <small>next 7 days</small></p>
            ${Object.entries(next7).map(([iso,n]) => `<div class="bar-chart-row"><span class="bar-chart-label">${weekdayName(iso).slice(0,3)} ${shortDate(iso)}</span><span class="bar-chart-track"><span class="bar-chart-fill" style="width:${(n/maxWorkload)*100}%"></span></span><span class="bar-chart-val">${n}</span></div>`).join('')}
          </div>
        </div>
        <div>
          <div class="card"><p class="card-title">Completed</p>
            <div class="bar-chart-row"><span class="bar-chart-label">This week</span><span class="bar-chart-val" style="width:auto;">${doneThisWeek}</span></div>
            <div class="bar-chart-row"><span class="bar-chart-label">This month</span><span class="bar-chart-val" style="width:auto;">${doneThisMonth}</span></div>
          </div>
          <div class="card"><p class="card-title">Study time</p>
            <div class="bar-chart-row"><span class="bar-chart-label">This week</span><span class="bar-chart-val" style="width:auto;">${weekStudyMin} min</span></div>
            <div class="bar-chart-row"><span class="bar-chart-label">All time</span><span class="bar-chart-val" style="width:auto;">${totalStudyMin} min</span></div>
          </div>
        </div>
      </div>
    `;
  };

  /* =========================================================

  function openStudySessionModal(id, prefill){
    const existing = id ? state.studySessions.find(s=>s.id===id) : null;
    const s = existing || { id: uid(), subject:'', classId:null, assignmentId:null, date: todayISO(), startTime: nowHM(), durationMin: state.settings.defaultDuration||30, completed:false, actualMin:0, created:Date.now() };
    Object.assign(s, prefill||{});
    const isNew = !existing;
    openModal({
      title: isNew ? 'New study session' : 'Study session',
      bodyHtml: `
        <div class="field-row"><div class="field"><label>Class</label><select id="ssClass"><option value="">None</option>${state.classes.map(c=>`<option value="${c.id}" ${s.classId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Linked assignment</label><select id="ssAssign"><option value="">None</option>${activeAssignments().filter(a=>!isDone(a)).map(a=>`<option value="${a.id}" ${s.assignmentId===a.id?'selected':''}>${escapeHtml(a.title)}</option>`).join('')}</select></div></div>
        <div class="field-row3"><div class="field"><label>Date</label><input type="date" id="ssDate" value="${s.date}"></div>
        <div class="field"><label>Start time</label><input type="time" id="ssStart" value="${s.startTime}"></div>
        <div class="field"><label>Duration (min)</label><input type="number" min="5" step="5" id="ssDuration" value="${s.durationMin}"></div></div>
        <div class="timer-display">
          <div class="timer-clock mono" id="timerClock">${fmtClock((s.remainingSec!=null?s.remainingSec:s.durationMin*60))}</div>
          <div class="timer-controls">
            <button class="btn-secondary btn-sm" id="timerStart">Start</button>
            <button class="btn-secondary btn-sm" id="timerPause">Pause</button>
            <button class="btn-secondary btn-sm" id="timerReset">Reset</button>
            <button class="btn-primary" style="width:auto;" id="timerFinish">Finish</button>
          </div>
        </div>
      `,
      footerHtml: `<div>${isNew?'':'<button class="btn-danger btn-sm" id="ssDelete">Delete</button>'}</div>
        <div class="modal-footer-right"><button class="btn-ghost" id="ssCancel">Close</button><button class="btn-primary" style="width:auto;" id="ssSave">${isNew?'Save session':'Save'}</button></div>`,
      onMount(){
        stopTimer(true);
        let remaining = (s.durationMin||30) * 60;
        ui.timer = { interval:null, remaining, running:false };
        function updateClock(){ byId('timerClock').textContent = fmtClock(ui.timer.remaining); }
        byId('timerStart').addEventListener('click', () => {
          if(ui.timer.running) return;
          ui.timer.running = true;
          ui.timer.interval = setInterval(() => {
            ui.timer.remaining = Math.max(0, ui.timer.remaining - 1);
            updateClock();
            if(ui.timer.remaining === 0){ stopTimer(); toast('Time\u2019s up — nice work.'); }
          }, 1000);
        });
        byId('timerPause').addEventListener('click', () => stopTimer());
        byId('timerReset').addEventListener('click', () => { stopTimer(); ui.timer.remaining = Number(byId('ssDuration').value||30)*60; updateClock(); });
        byId('timerFinish').addEventListener('click', () => {
          const elapsedMin = Math.round((((Number(byId('ssDuration').value||30)*60) - ui.timer.remaining))/60);
          s.completed = true; s.actualMin = Math.max(elapsedMin, 1);
          stopTimer(true);
          persistSession();

  async function syncCanvas(){
    const domainRaw = byId('canvasDomainInput').value.trim();
    const tokenInput = byId('canvasTokenInput').value.trim();
    const token = tokenInput || state.settings.canvas.token;
    if(!domainRaw || !token){ byId('canvasStatus').textContent = 'Enter both your Canvas domain and access token.'; return; }
    const domain = domainRaw.replace(/^https?:\/\//i,'').replace(/\/+$/,'');
    state.settings.canvas.domain = domain;
    state.settings.canvas.token = token;
    saveState();
    const statusEl = byId('canvasStatus');
    statusEl.textContent = 'Syncing\u2026';
    byId('canvasSyncBtn').disabled = true;
    try{
      const coursesRes = await fetch(`https://${domain}/api/v1/courses?enrollment_state=active&per_page=100`, { headers:{ 'Authorization':'Bearer '+token } });
      if(!coursesRes.ok) throw new Error('Canvas returned ' + coursesRes.status + ' fetching courses');
      const courses = await coursesRes.json();
      if(!Array.isArray(courses)) throw new Error('Unexpected response from Canvas');
      let imported=0, updated=0;
      for(const course of courses){
        if(!course || !course.id || course.access_restricted_by_date) continue;
        const courseName = course.course_code || course.name || 'Canvas';
        let cls = state.classes.find(c => c.name.toLowerCase() === courseName.toLowerCase());
        if(!cls){
          cls = { id:uid(), name: courseName, teacher:'', room:'', color: CLASS_COLORS[state.classes.length % CLASS_COLORS.length], schedule:[], notes:'', created:Date.now(), fromCanvas:true };
          state.classes.push(cls);
        }
        let assignments = [];
        try{
          const aRes = await fetch(`https://${domain}/api/v1/courses/${course.id}/assignments?per_page=100&order_by=due_at`, { headers:{ 'Authorization':'Bearer '+token } });
          if(!aRes.ok) continue;
          assignments = await aRes.json();
        }catch(e){ continue; }
        assignments.forEach(a => {
          if(!a || !a.due_at) return;
          const cid = 'canvas-' + a.id;
          const due = a.due_at.slice(0,10);
          const existing = state.assignments.find(t => t.id===cid || t.canvasId===a.id);
          if(existing){
            existing.title = a.name || existing.title;
            existing.due = due;
            existing.classId = cls.id;
            existing.subject = cls.name;
            existing.modified = Date.now();
            updated++;
          } else {
            state.assignments.push(newAssignment({
              id: cid, title: a.name || 'Untitled assignment', classId: cls.id, subject: cls.name, due,
              status: a.has_submitted_submissions ? 'completed' : 'not-started',
              progress: a.has_submitted_submissions ? 100 : 0,
              source:'canvas', canvasId: a.id
            }));
            imported++;
          }
        });
      }
      state.settings.canvas.connected = true;
      state.settings.canvas.lastSynced = Date.now();
      logActivity('canvas', 'Synced Canvas — ' + imported + ' new, ' + updated + ' updated');
      saveState();
      statusEl.textContent = `Synced \u2014 ${imported} new, ${updated} updated. Last synced ${new Date(state.settings.canvas.lastSynced).toLocaleString()}.`;
      toast('Canvas synced', 'success');
      renderCurrentView();
    }catch(e){
      statusEl.textContent = 'Could not reach Canvas (' + e.message + '). Most schools block direct browser requests to Canvas from outside pages (CORS) \u2014 if this keeps failing, that\u2019s almost certainly why, and there isn\u2019t a workaround from a page like this one.';
    } finally {
      byId('canvasSyncBtn').disabled = false;
    }
  }

  /* ---------- import / export ---------- */
  function exportJson(){
    const payload = { exportedAt: new Date().toISOString(), user: currentUser, data: state };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    downloadBlob(blob, 'docket-' + currentUser.toLowerCase().replace(/\s+/g,'-') + '.json');
    toast('Exported JSON');
  }
  function exportCsv(){
    const rows = [['Title','Subject','Due Date','Due Time','Priority','Type','Status','Progress','Estimate (min)','Tags']];
    activeAssignments().forEach(a => rows.push([a.title, subjectLabel(a), a.due, a.dueTime, a.priority, a.type, a.status, a.progress, a.estimate||'', a.tags.join('; ')]));
    const csv = rows.map(r => r.map(v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"').join(',')).join('\n');
    const blob = new Blob([csv], { type:'text/csv' });
    downloadBlob(blob, 'docket-assignments-' + currentUser.toLowerCase().replace(/\s+/g,'-') + '.csv');
    toast('Exported CSV');
  }
  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  byId('importFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        const incoming = parsed && parsed.data ? parsed.data : parsed;
        if(!incoming || typeof incoming !== 'object') throw new Error('bad file');
        confirmDialog('Import this file? It will replace your current Docket data for ' + currentUser + '.', {
          confirmLabel:'Import', onConfirm(){
            state = migrateState(Object.assign(defaultState(currentUser), incoming, { user: currentUser }));
            saveState(); renderCurrentView(); toast('Data imported', 'success');
          }
        });
      }catch(err){ toast('That file doesn\u2019t look like a valid Docket export.', 'error'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  /* ---------- import from another local account on this device ----------
     Finds Docket data saved in this browser under a different name (e.g.
     demo mode, or an account from before this device was pointed at the
     current Supabase backend) and lets it be merged or copied into the
     currently signed-in account. Nothing here reaches across browsers or
     devices — it only reads localStorage.getItem(). */
  function findLocalAccounts(){
    const prefix = STORAGE_PREFIX + ':data:v2:';
    const found = [];
    try{
      for(let i=0;i<localStorage.length;i++){
        const key = localStorage.key(i);
        if(!key || key.indexOf(prefix) !== 0) continue;
        let parsed;
        try{ parsed = JSON.parse(localStorage.getItem(key)); }catch(e){ continue; }
        if(!parsed || typeof parsed !== 'object') continue;
        found.push({
          key,
          username: key.slice(prefix.length),
          counts: {
            assignments: Array.isArray(parsed.assignments) ? parsed.assignments.length : 0,
            classes: Array.isArray(parsed.classes) ? parsed.classes.length : 0,
            notes: Array.isArray(parsed.notes) ? parsed.notes.length : 0
          }
        });
      }
    }catch(e){}
    return found;
  }

  // Adds an incoming state's data into the currently loaded `state`, matching
  // classes by name (so "Biology" in both doesn't become two separate
  // classes) and giving everything else fresh ids so nothing collides.
  function mergeIncomingState(raw){
    const incoming = migrateState(Object.assign(defaultState(raw.user || 'Imported'), raw));
    const classIdMap = {};
    incoming.classes.forEach(c => {
      const existing = state.classes.find(ec => ec.name.trim().toLowerCase() === (c.name||'').trim().toLowerCase());
      if(existing){ classIdMap[c.id] = existing.id; }
      else{ const copy = Object.assign({}, c, { id: uid() }); classIdMap[c.id] = copy.id; state.classes.push(copy); }
    });
    incoming.assignments.forEach(a => {
      const copy = Object.assign({}, a, { id: uid() });
      if(copy.classId && classIdMap[copy.classId]) copy.classId = classIdMap[copy.classId];
      linkAssignmentToClass(copy);
      state.assignments.push(copy);
    });
    incoming.exams.forEach(x => state.exams.push(Object.assign({}, x, { id: uid() })));
    incoming.notes.forEach(n => state.notes.push(Object.assign({}, n, { id: uid() })));
    incoming.studySessions.forEach(s => state.studySessions.push(Object.assign({}, s, { id: uid() })));
    logActivity('import', 'Merged in data from a local account (' + (raw.user || 'unnamed') + ')');
  }

  function renderSearchResults(q){
    const el = byId('searchResults'); if(!el) return;
    if(!q){ el.innerHTML = `<p class="empty-state">Type to search across everything in Docket.</p>`; return; }
    const results = [];
    activeAssignments().forEach(a => { if((a.title+' '+subjectLabel(a)+' '+a.tags.join(' ')).toLowerCase().includes(q)) results.push({ type:'Assignment', title:a.title, sub: subjectLabel(a), action:()=>openAssignmentModal(a.id) }); });
    state.classes.forEach(c => { if((c.name+' '+(c.teacher||'')).toLowerCase().includes(q)) results.push({ type:'Class', title:c.name, sub:c.teacher||'', action:()=>openClassDetail(c.id) }); });
    state.exams.forEach(ex => { if(ex.name.toLowerCase().includes(q)) results.push({ type:'Exam', title:ex.name, sub: shortDate(ex.date), action:()=>openExamModal(ex.id) }); });
    state.notes.forEach(n => { if((n.title+' '+n.body).toLowerCase().includes(q)) results.push({ type:'Note', title:n.title||'Untitled note', sub: (n.body||'').slice(0,60), action:()=>openNoteModal(n.id) }); });
    if(!results.length){ el.innerHTML = `<p class="empty-state">No results for "${escapeHtml(q)}".</p>`; return; }
    el.innerHTML = results.slice(0,30).map((r,i) => `<div class="search-result" data-i="${i}"><span class="search-result-type">${r.type}</span><span>${escapeHtml(r.title)}${r.sub?' — <span style="color:var(--muted);">'+escapeHtml(r.sub)+'</span>':''}</span></div>`).join('');
    qsa('.search-result', el).forEach((row,i) => row.addEventListener('click', () => { closeModal(); setTimeout(()=>results[i].action(), 60); }));
  }

  function seedDemoData(){
    const mk = (o) => Object.assign({ demo:true }, o);
    const math = { id: uid(), name:'Algebra II', teacher:'Mr. Alvarez', room:'204', color: CLASS_COLORS[0], schedule:[{id:uid(),day:1,start:'09:00',end:'09:50'},{id:uid(),day:3,start:'09:00',end:'09:50'}], notes:'', created:Date.now(), demo:true };
    const bio = { id: uid(), name:'Biology', teacher:'Dr. Nkomo', room:'118', color: CLASS_COLORS[1], schedule:[{id:uid(),day:2,start:'11:00',end:'11:50'},{id:uid(),day:4,start:'11:00',end:'11:50'}], notes:'', created:Date.now(), demo:true };
    const eng = { id: uid(), name:'English 10', teacher:'Ms. Patel', room:'A2', color: CLASS_COLORS[2], schedule:[{id:uid(),day:1,start:'13:00',end:'13:50'},{id:uid(),day:5,start:'13:00',end:'13:50'}], notes:'', created:Date.now(), demo:true };
    state.classes.push(math, bio, eng);

    state.assignments.push(
      newAssignment(mk({ title:'Chapter 4 problem set', classId:math.id, subject:math.name, due: todayISO(), priority:'high', type:'homework', estimate:45, status:'not-started', subtasks:[{id:uid(),text:'Problems 1-10',done:false},{id:uid(),text:'Problems 11-20',done:false}] })),
      newAssignment(mk({ title:'Biology lab report — osmosis', classId:bio.id, subject:bio.name, due: fmtISO(addDays(todayDate(),1)), priority:'high', type:'lab', estimate:60, status:'in-progress', progress:40 })),
      newAssignment(mk({ title:'Essay draft: To Kill a Mockingbird', classId:eng.id, subject:eng.name, due: fmtISO(addDays(todayDate(),2)), priority:'medium', type:'essay', estimate:90, status:'not-started' })),
      newAssignment(mk({ title:'Read Chapter 7', classId:eng.id, subject:eng.name, due: fmtISO(addDays(todayDate(),-1)), priority:'low', type:'reading', estimate:20, status:'not-started' })),
      newAssignment(mk({ title:'Quiz corrections', classId:math.id, subject:math.name, due: fmtISO(addDays(todayDate(),5)), priority:'low', type:'homework', estimate:15, status:'completed', progress:100 }))
    );

    state.exams.push({ id: uid(), name:'Biology Unit Test', classId: bio.id, date: fmtISO(addDays(todayDate(),6)), time:'10:00', location:'Room 118', topics:'Cell structure, osmosis, mitosis', notes:'', created:Date.now(), demo:true });

    state.studySessions.push({ id: uid(), subject: math.name, classId: math.id, assignmentId:null, date: todayISO(), startTime:'16:00', durationMin:30, completed:false, actualMin:0, created:Date.now(), demo:true });

    state.notes.push({ id: uid(), title:'Osmosis — key terms', body:'Hypertonic, hypotonic, isotonic solutions and how they affect cell volume. Review diagram from Monday\'s lecture before the test.', subject: bio.name, tags:['biology','exam-prep'], created:Date.now(), modified:Date.now(), demo:true });

    state.ui.demo = true;
    state.ui.onboarded = true;
    logActivity('demo', 'Loaded demo data');
  }
  function removeDemoData(){
    state.assignments = state.assignments.filter(a=>!a.demo);
    state.classes = state.classes.filter(c=>!c.demo);
    state.exams = state.exams.filter(e=>!e.demo);
    state.notes = state.notes.filter(n=>!n.demo);
    state.studySessions = state.studySessions.filter(s=>!s.demo);
    state.ui.demo = false;
  }

  /* =========================================================
     THEME
     ========================================================= */
  function applyTheme(){
    const t = state && state.settings ? state.settings.theme : 'system';
    let effective = t;
    if(t === 'system'){ effective = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    document.documentElement.setAttribute('data-theme', effective);
  }
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(state && state.settings.theme==='system') applyTheme(); });
  }

  /* =========================================================
     INIT
     ========================================================= */
  applyTheme();
  bootstrapSession();
})();
</script>
